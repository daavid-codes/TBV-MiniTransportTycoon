name: Unity CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Run Unity Tests + Code Coverage + Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Unity Tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          projectPath: Mini Transport Tycoon
          testMode: editmode
          githubToken: ""                # Do not post PR comments from test runner
          enableCodeCoverage: true
          enableTestReporting: true     # Enable test reporting
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport'
          customParameters: >-
            -pathFilters:+Assets/Scripts/Bus.cs,+Assets/Scripts/Car.cs,+Assets/Scripts/CarType.cs,+Assets/Scripts/GameController.cs,+Assets/Scripts/GameData.cs,+Assets/Scripts/MenuController.cs,+Assets/Scripts/TopBarManager.cs,+Assets/Scripts/MainMenu.cs,+Assets/Scripts/Vehicle.cs

      - name: Debug Coverage Paths
        if: always()
        run: |
          echo "artifactsPath=${{ steps.tests.outputs.artifactsPath }}"
          echo "coveragePath=${{ steps.tests.outputs.coveragePath }}"
          ls -la "${{ steps.tests.outputs.artifactsPath }}" || true
          ls -la "${{ steps.tests.outputs.coveragePath }}" || true

      - name: Prepare Coverage Artifact Folder
        if: always()
        run: |
          set -eu
          rm -rf coverage-artifact
          mkdir -p coverage-artifact

          copied=false

          if [ -d "${{ steps.tests.outputs.coveragePath }}" ]; then
            cp -R "${{ steps.tests.outputs.coveragePath }}" coverage-artifact/CodeCoverage
            copied=true
          fi

          if [ -d "${{ steps.tests.outputs.artifactsPath }}" ]; then
            first_match="$(find "${{ steps.tests.outputs.artifactsPath }}" -type d -name CodeCoverage | head -n 1 || true)"
            if [ -n "$first_match" ] && [ "$copied" = false ]; then
              cp -R "$first_match" coverage-artifact/CodeCoverage
              copied=true
            fi
          fi

          if [ "$copied" = false ]; then
            echo "Coverage output was not found in this run." > coverage-artifact/README.txt
          fi

      - name: Add Coverage Summary
        if: always()
        run: |
          set -eu

          summary_xml="$(find coverage-artifact -type f -name Summary.xml | head -n 1 || true)"

          if [ -z "$summary_xml" ]; then
            {
              echo "## Code Coverage"
              echo ""
              echo "Coverage summary was not found in this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - "$summary_xml" "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          summary_xml = sys.argv[1]
          summary_out = sys.argv[2]

          def pct(v):
              return f"{v * 100:.2f}%"

          root = ET.parse(summary_xml).getroot()
          tag = root.tag.split("}")[-1]

          line_coverage = None
          method_coverage = None
          covered_lines = None
          total_lines = None
          covered_methods = None
          total_methods = None

          if tag.lower() == "coverage" and "line-rate" in root.attrib:
              line_coverage = float(root.attrib.get("line-rate", "0"))
              method_coverage = float(root.attrib.get("branch-rate", "0"))
          else:
              summary_node = root.find(".//Summary")
              if summary_node is not None:
                  attrs = summary_node.attrib

                  if attrs.get("numSequencePoints") and attrs.get("visitedSequencePoints"):
                      total_lines = int(attrs["numSequencePoints"])
                      covered_lines = int(attrs["visitedSequencePoints"])
                      line_coverage = (covered_lines / total_lines) if total_lines else 0.0

                  if attrs.get("numMethods") and attrs.get("visitedMethods"):
                      total_methods = int(attrs["numMethods"])
                      covered_methods = int(attrs["visitedMethods"])
                      method_coverage = (covered_methods / total_methods) if total_methods else 0.0

          with open(summary_out, "a", encoding="utf-8") as out:
              out.write("## Code Coverage\\n\\n")
              out.write("| Metric | Value |\\n")
              out.write("| --- | --- |\\n")

              if line_coverage is not None:
                  if covered_lines is not None and total_lines is not None:
                      out.write(f"| Line Coverage | {pct(line_coverage)} ({covered_lines}/{total_lines}) |\\n")
                  else:
                      out.write(f"| Line Coverage | {pct(line_coverage)} |\\n")

              if method_coverage is not None:
                  if covered_methods is not None and total_methods is not None:
                      out.write(f"| Method Coverage | {pct(method_coverage)} ({covered_methods}/{total_methods}) |\\n")
                  else:
                      out.write(f"| Method Coverage | {pct(method_coverage)} |\\n")

              if line_coverage is None and method_coverage is None:
                  out.write("| Coverage | Unable to parse Summary.xml |\\n")

              out.write(f"\\nParsed from: {summary_xml}\\n")
          PY

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage-artifact/**

      - name: Static Analysis (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Mini Transport Tycoon
          targetPlatform: StandaloneLinux64
          buildMethod: UnityEditor.CodeAnalysis.CodeAnalysisRunner.Run
          versioning: None

  build:
    name: Build Unity Project
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Mini Transport Tycoon
          targetPlatform: StandaloneWindows64
          versioning: None

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/StandaloneWindows64
